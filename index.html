<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kakuaa</title>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Open Sans',sans-serif;
  margin:0;
  background:#f4f7f7;
  color:#1A237E;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
}

.hero h1{
  font-size:48px;
  margin-bottom:10px;
}

.hero span{
  color:#2ECC71;
}

.hero p{
  font-size:18px;
  color:#546E7A;
}

.precio{
  margin-top:25px;
  display:inline-block;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.precio strong{
  font-size:30px;
  color:#2ECC71;
}

.btn{
  display:inline-block;
  margin-top:25px;
  background:#2ECC71;
  color:white;
  padding:14px 30px;
  border-radius:30px;
  text-decoration:none;
  font-weight:700;
}

/* FEATURES */
.features{
  text-align:center;
  padding:50px 20px;
}

.features img{
  width:70px;
  margin:20px;
  transition:.3s;
}

.features img:hover{
  transform:scale(1.1);
}

/* FORM */
.lead-section{
  text-align:center;
  padding:60px 20px;
  background:#ffffff;
}

.lead-section h2{
  margin-bottom:20px;
}

#form input{
  display:block;
  margin:10px auto;
  padding:12px;
  width:260px;
  border-radius:10px;
  border:1px solid #ccc;
}

#form button{
  background:#2ECC71;
  color:white;
  border:none;
  padding:12px 25px;
  border-radius:25px;
  cursor:pointer;
  margin-top:10px;
}

#mensaje{
  margin-top:15px;
  font-weight:600;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:24px;
  text-decoration:none;
}
</style>

</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Crecé con <span>Kakuaa</span></h1>

  <p>
    Automatizá tu negocio, tomá mejores decisiones con datos  
    y escalá con inteligencia artificial — sin equipo técnico
  </p>

  <div class="precio">
    <h2>Desde <strong>₲700.000</strong></h2>
    <p>/ mes</p>
  </div>

  <a href="#formulario" class="btn">Empezar ahora</a>
</section>

<!-- FEATURES -->
<section class="features">
  <img src="https://ogues1.github.io/img/Nemura.png">
  <img src="https://ogues1.github.io/img/Marandu.png">
  <img src="https://ogues1.github.io/img/Temiandu.png">
  <img src="https://ogues1.github.io/img/Nodo.png">
</section>

<!-- FORMULARIO -->
<section class="lead-section" id="formulario">

  <h2>Dejanos tus datos</h2>

  <div id="form-container">
    <form id="form">

      <input type="text" name="nombre" placeholder="Nombre" required>
      <input type="text" name="apellido" placeholder="Apellido" required>
      <input type="email" name="mail" placeholder="Email" required>
      <input type="text" name="telefono" placeholder="Teléfono" required>

      <button type="submit">Quiero empezar</button>

    </form>
  </div>

  <p id="mensaje"></p>

</section>

<!-- WHATSAPP -->
<a href="https://wa.me/595981123456?text=Hola%20Kakuaa,%20quiero%20automatizar%20mi%20negocio" target="_blank" class="whatsapp">
💬
</a>

<!-- SCRIPT -->
<script>
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const form = this;

  const data = {
    nombre: form.nombre.value,
    apellido: form.apellido.value,
    mail: form.mail.value,
    telefono: form.telefono.value
  };

  fetch("https://script.google.com/macros/s/AKfycbyNVF8qErCrLisxXUnZkZqahyhumWYP-qVIKoPDTymS_OhU2PA41s5mEM3zCESzT0rC/exec", {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(() => {

    document.getElementById("form-container").style.display = "none";

    document.getElementById("mensaje").innerText =
      "✅ Gracias, ya recibimos tus datos. Te contactamos pronto.";

  })
  .catch(() => {
    document.getElementById("mensaje").innerText =
      "❌ Error al enviar, intenta nuevamente.";
  });
});
</script>

</body>
</html>
